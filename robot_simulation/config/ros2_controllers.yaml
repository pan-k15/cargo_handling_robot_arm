controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/GripperActionController

# ── Arm: position-controlled JointTrajectoryController ───────────
arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0  # 0 = no time constraint

# ── Gripper: GripperActionController exposes GripperCommand action ─
gripper_controller:
  ros__parameters:
    joint: finger_left_joint
    goal_tolerance: 0.001
    max_effort: 200.0
    allow_stalling: true          # stall = fingers pressed on object = successful grip
    stall_velocity_threshold: 0.001
    stall_timeout: 0.5
